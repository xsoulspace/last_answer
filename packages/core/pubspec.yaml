name: core
description: Unified data layer & tools
version: 0.0.1
publish_to: "none"

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  collection: ^1.19.1
  connectivity_plus: ^7.3.0
  equatable: ^2.1.0
  file_picker: ^12.0.0-beta.7
  file_saver: ^0.4.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  form_builder_validators: ^11.3.0
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  from_json_to_json: ^0.5.0
  go_router: ^17.3.0
  google_fonts: ^8.2.0
  # hive_ce: ^2.15.0
  # hive_ce_flutter: ^2.3.2
  intl: ^0.20.3
  # isar: ^4.0.0-dev.14
  # isar_flutter_libs: ^4.0.0-dev.14
  is_dart_empty_or_not: ^0.4.0
  json_annotation: ^4.12.0
  logger: ^2.7.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  path_to_regexp: ^0.4.0
  permission_handler: ^12.0.3
  provider: ^6.1.5+1
  quiver: ^3.2.2
  rxdart: ^0.28.0
  share_plus: ^13.2.1
  shared_models:
  shared_preferences: ^2.5.5
  ui_kit:
  universal_io: ^2.3.1
  universal_storage_interface:
  universal_storage_local_db:
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  xsoulspace_foundation:
  xsoulspace_locale:
  xsoulspace_state_utils:
  xsoulspace_ui_foundation:

dev_dependencies:
  build_runner: ^2.15.2
  json_serializable: ^6.14.0
  faker: ^2.2.0
  flutter_test:
    sdk: flutter
  freezed: 3.2.5
  # hive_ce_generator: ^1.10.0
  lints: ^6.1.0
  # mockito: ^5.5.1
  mocktail: ^1.0.5
  mocktail_image_network: ^1.3.0
  xsoulspace_lints: ^0.1.2

# For information see the following page:
# https://pub.dev/packages/flutter_gen
flutter_gen:
  output: lib/src/generated/ # Optional (default: lib/gen/)
  lineLength: 80

  assets:
    enabled: true
    outputs:
      gen_for_package: true
      package_parameter_enabled: true

  integrations:
    flutter_svg: true

  fonts:
    enabled: true

flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/json/
    - google_fonts/

fonts:
  - family: IBMPlexSans
    fonts:
      - asset: google_fonts/IBMPlexSans-Thin.ttf
        weight: 100
      - asset: google_fonts/IBMPlexSans-Light.ttf
        weight: 300
      - asset: google_fonts/IBMPlexSans-Regular.ttf
        weight: 400
      - asset: google_fonts/IBMPlexSans-Medium.ttf
        weight: 500
      - asset: google_fonts/IBMPlexSans-SemiBold.ttf
        weight: 700
      - asset: google_fonts/IBMPlexSans-Bold.ttf
        weight: 900
  - family: NotoColorEmoji
    fonts:
      - asset: google_fonts/NotoColorEmoji.ttf
  - family: NotoSans
    fonts:
      - asset: google_fonts/NotoSans-Regular.ttf
flutter_intl:
  enabled: true
