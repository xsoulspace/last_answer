name: core
description: Unified data layer & tools
version: 0.0.1
publish_to: "none"

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  collection: ^1.19.1
  connectivity_plus: ^7.0.0
  equatable: ^2.0.7
  file_picker: ^10.3.3
  file_saver: ^0.3.1
  file_selector: ^1.0.4
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  form_builder_validators: ^11.2.0
  fpdart: ^1.1.1
  freezed_annotation: ^3.1.0
  from_json_to_json: ^0.3.0
  go_router: ^16.2.5
  google_fonts: ^6.3.2
  # hive_ce: ^2.15.0
  # hive_ce_flutter: ^2.3.2
  intl: ^0.20.2
  # isar: ^4.0.0-dev.14
  # isar_flutter_libs: ^4.0.0-dev.14
  is_dart_empty_or_not: ^0.2.3
  json_annotation: ^4.9.0
  logger: ^2.6.2
  package_info_plus: ^9.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  path_to_regexp: ^0.4.0
  permission_handler: ^12.0.1
  provider: ^6.1.5+1
  quiver: ^3.2.2
  rxdart: ^0.28.0
  share_plus: ^12.0.0
  shared_models:
  shared_preferences: ^2.5.3
  ui_kit:
  universal_io: ^2.2.2
  universal_storage_db: ^0.1.0-dev.2
  universal_storage_filesystem: ^0.1.0-dev.10
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  xsoulspace_foundation: ^0.3.0
  xsoulspace_locale: ^0.3.0
  xsoulspace_state_utils: ^0.5.1
  xsoulspace_ui_foundation: ^0.3.1

dev_dependencies:
  # build_runner: ^2.9.0
  faker: ^2.2.0
  # flutter_gen: ^5.12.0
  # flutter_gen_runner: ^5.12.0
  flutter_test:
    sdk: flutter
  # freezed: ^3.2.3
  # hive_ce_generator: ^1.10.0
  lints: ^6.0.0
  # mockito: ^5.5.1
  mocktail: ^1.0.4
  mocktail_image_network: ^1.2.0
  xsoulspace_lints: ^0.1.2

# For information see the following page:
# https://pub.dev/packages/flutter_gen
flutter_gen:
  output: lib/src/generated/ # Optional (default: lib/gen/)
  lineLength: 80

  assets:
    enabled: true
    outputs:
      gen_for_package: true
      package_parameter_enabled: true

  integrations:
    flutter_svg: true

  fonts:
    enabled: true

flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/json/
    - google_fonts/

fonts:
  - family: IBMPlexSans
    fonts:
      - asset: google_fonts/IBMPlexSans-Thin.ttf
        weight: 100
      - asset: google_fonts/IBMPlexSans-Light.ttf
        weight: 300
      - asset: google_fonts/IBMPlexSans-Regular.ttf
        weight: 400
      - asset: google_fonts/IBMPlexSans-Medium.ttf
        weight: 500
      - asset: google_fonts/IBMPlexSans-SemiBold.ttf
        weight: 700
      - asset: google_fonts/IBMPlexSans-Bold.ttf
        weight: 900
  - family: NotoColorEmoji
    fonts:
      - asset: google_fonts/NotoColorEmoji.ttf
  - family: NotoSans
    fonts:
      - asset: google_fonts/NotoSans-Regular.ttf
flutter_intl:
  enabled: true
