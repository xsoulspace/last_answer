  universal_storage_github_oauth:
    path: ../dart_flutter_packages/pkgs/universal_storage_github_oauth
  universal_storage_filesystem:
    path: ../dart_flutter_packages/pkgs/universal_storage_filesystem
  universal_storage_git_offline:
    path: ../dart_flutter_packages/pkgs/universal_storage_git_offline
  universal_storage_interface:
    path: ../dart_flutter_packages/pkgs/universal_storage_interface
  # ADR 0007 — the actor roster syncs as a durable LWW kernel doc
  # (ConvergenceDoc); the mesh layer attaches to its seams later.
  universal_storage_convergence:
    path: ../dart_flutter_packages/pkgs/universal_storage_convergence
  universal_storage_mesh:
    path: ../dart_flutter_packages/pkgs/universal_storage_mesh
  # ADR 0047 — the world layer: interest policies, zone catalogs, the
  # host-driven pulse contract; the mesh session consumes it.
  universal_storage_world:
    path: ../dart_flutter_packages/pkgs/universal_storage_world
  universal_storage_mesh_transport:
    path: ../dart_flutter_packages/pkgs/universal_storage_mesh_transport
  # ADR 0050 — the realtime event plane (live presence/activity for the
  # multiplayer feel): committed locally, not yet published.
  universal_storage_realtime:
    path: ../dart_flutter_packages/pkgs/universal_storage_realtime
  xsoulspace_inference_acp:
    path: ../dart_flutter_packages/pkgs/xsoulspace_inference_acp
  xsoulspace_inference_core:
    path: ../dart_flutter_packages/pkgs/xsoulspace_inference_core
  # The local laya-serve runtime the agent doc's laya backend probes —
  # composed through afm's layaDecisionBinding (local dev train).
  xsoulspace_inference_laya:
    path: ../dart_flutter_packages/pkgs/xsoulspace_inference_laya
  http: ^1.6.0
  # The shared permission contract: ChatPermissionPolicy's stance
  # decisions are core policies; the doc router and ACP round-trip stay
  # product-side.
  xsoulspace_permission_core:
    path: ../dart_flutter_packages/pkgs/xsoulspace_permission_core
  # The engine and host live in ecsai_harness.
  # xsoulspace_agentic_afm is the AFM composition root (appleFoundationBinding).
  xsoulspace_agentic_harness:
    path: ../../ecsai_harness/pkgs/xsoulspace_agentic_harness
  # The world inspector pane (agent doc view): the harness's 3D inspector
  # EMBEDDED — one renderer, no parallel beat/trace renderer in this repo
  # (inspector DESIGN.md "Boundary 2026-10-05 rev. 3").
  xsoulspace_agentic_harness_inspector:
    path: ../../ecsai_harness/pkgs/xsoulspace_agentic_harness_inspector
  xsoulspace_agentic_host:
    path: ../../ecsai_harness/pkgs/xsoulspace_agentic_host
  xsoulspace_agentic_afm:
    path: ../../ecsai_harness/pkgs/xsoulspace_agentic_afm
  xsoulspace_inference_apple_foundation:
    path: ../dart_flutter_packages/pkgs/xsoulspace_inference_apple_foundation
  dart_acp_toolkit:
    path: ../../../mcp/cline/intentcall/packages/acp_toolkit
  # Mesh task board (agent tasks riding the mesh) — WorldSync adapter over
  # the convergence kernel; the kernel itself resolves through the root's
  # universal_storage_convergence path dependency above.
  ecsly_world_sync:
    path: ../../ecsly/plugins/ecsly_world_sync
  headless_core:
    path: packages/headless_core
  universal_io: ^2.3.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  mobile_scanner: ^7.0.1
  qr: ^4.0.0

  intl: any
  xsoulspace_monetization_foundation: any
  xsoulspace_foundation: any
  xsoulspace_installation_store: any
  xsoulspace_monetization_interface: any
  file_selector: any
  # harness_host.dart imports the OpenRouter binding directly (backend
  # registration) — declared as the path dep it already resolves through.
  xsoulspace_inference_openrouter:
    path: ../dart_flutter_packages/pkgs/xsoulspace_inference_openrouter
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  # Hosted-chat port tests mock the transport (openrouter client's own dep).
  http: ^1.6.0
  # The multiplayer gate scenario (tool/gates/multiplayer_harness_gate.dart)
  # drives two real app instances through flutter_mcp_harness — the
  # user-directed regular cross-platform (incl. web) testing mechanism.
  flutter_mcp_harness:
    path: ../../../mcp/cline/mcp_flutter/packages/harness
  # The web peer of the same gate is driven through the CDP accessibility
  # tree (ChromeAppTarget/CdpDriver + the AutomationAction vocabulary) —
  # the compiled CDP automation stack, no VM service on the web side.
  universal_browser_cdp: ^0.1.0
  universal_automation_interface: ^0.1.0
  # Phase 1.5 widget tests fake the directory picker over its platform
  # interface (file_selector itself stays a runtime dependency).
  file_selector_platform_interface: ^2.7.0
  # TASK B / R8: the AFM e2e gate runs as a real macOS app
  # (`flutter test integration_test -d macos` — macOS 26 + Apple Intelligence).
  integration_test:
    sdk: flutter
  # freezed: ^3.2.3
  lints: ^6.1.0
  # mockito: ^5.5.1
  mocktail: ^1.0.5
  msix: ^3.18.0
  xsoulspace_lints: ^0.1.2
  # oka Dart pipeline hook (ADR-0010): the build config lives in
  # tool/oka_pipeline.dart; `oka build` delegates there. oka_core provides
  # okaRun; oka_android the Android pipeline/steps. No `oka` CLI dep needed.
  oka_android:
    path: ../../oka/packages/oka_android
  oka_core:
    path: ../../oka/packages/oka_core
  # Store publish targets (ADR-0014): declared in tool/oka_pipeline.dart,
  # run via `oka run publish-play` / `oka run publish-huawei`.
  oka_huawei:
    path: ../../oka/packages/oka_huawei
  # ADR 0072 device gate: the Android app target (oka dev owning session
  # → runner-session.json → LaunchedApp) for tool/gates.
  oka_harness:
    path: ../../oka/packages/oka_harness
  oka_play:
    path: ../../oka/packages/oka_play

  web: any
dependency_overrides:
  # Oka and the ACP seat share the same composition contract as the harness.
  # Keep one local source across their transitive version constraints.
  resource_composition:
    path: ../../oka/packages/resource_composition
  # universal_storage_mesh declares this hosted; the package is committed
  # locally but not yet published — pin the local checkout so the graph
  # sees ONE source. Drop when pub.dev has it.
  universal_storage_world:
    path: ../dart_flutter_packages/pkgs/universal_storage_world
  # Same one-source law: the mesh lane's chunk store (ADR 0049) is committed
  # locally, not yet published. Drop when pub.dev has it.
  universal_storage_chunks:
    path: ../dart_flutter_packages/pkgs/universal_storage_chunks
  # oka_harness (the device gate's AndroidAppTarget) must see the SAME
  # flutter_mcp_harness this repo pins (the mcp_flutter checkout).
  flutter_mcp_harness:
    path: ../../../mcp/cline/mcp_flutter/packages/harness
  # The CDP automation stack's web-driving layer (ChromeAppTarget's
  # transport): 0.2.0 (ag-c, auto-wait + NavigateWait + semantic clicks)
  # is committed locally but not yet published — drop when pub.dev has it.
  universal_browser_cdp:
    path: ../dart_flutter_packages/pkgs/universal_browser_cdp
  universal_automation_interface:
    path: ../dart_flutter_packages/pkgs/universal_automation_interface
  # The local acp_toolkit checkout moved to the intentcall 0.7.0 release
  # train (additive schema/core changes) while the harness repo still pins
  # ^0.6.0 against its git-sourced acp_toolkit. Pin the train + the local
  # mcp_toolkit 5.1.0 here so the app graph resolves; drop when the
  # harness repo completes its migration.
  mcp_toolkit:
    path: ../../../mcp/cline/mcp_flutter/mcp_toolkit
  # mcp_toolkit's sibling in the mcp_flutter workspace — the canonical
  # ToolkitExtensionNames (its pub.dev copy lags the local checkout).
  flutter_mcp_toolkit_core:
    path: ../../../mcp/cline/mcp_flutter/packages/core
  # The local intentcall train moved to 1.0.0 (automation-catalog actions:
  # IntentAutomationAction.custom + InvokeAction) while the last release
  # is 0.7.0 — pin the moved packages to the local checkouts so the whole
  # graph sees ONE API. Drop when 1.0.0 publishes.
  intentcall_schema:
    path: ../../../mcp/cline/intentcall/packages/intentcall_schema
  intentcall_core:
    path: ../../../mcp/cline/intentcall/packages/intentcall_core
  intentcall_mcp:
    path: ../../../mcp/cline/intentcall/packages/intentcall_mcp
  intentcall_platform:
    path: ../../../mcp/cline/intentcall/packages/intentcall_platform
  # intentcall_platform's own 0.7.0-train deps are unpublished/path-only
  # in the local train checkout — resolve them from the same checkout.
  intentcall_bridge:
    path: ../../../mcp/cline/intentcall/packages/intentcall_bridge
  intentcall_platform_android:
    path: ../../../mcp/cline/intentcall/packages/intentcall_platform_android
  intentcall_platform_apple:
    path: ../../../mcp/cline/intentcall/packages/intentcall_platform_apple
  # intentcall_platform's 1.0.0 train added a sync sibling that is not on
  # pub.dev yet — same unpublished/path-only rule as the overrides above.
  intentcall_platform_sync:
    path: ../../../mcp/cline/intentcall/packages/intentcall_platform_sync
  # Bootstrap (ADR-0010): oka_core/oka_android are not yet on pub.dev —
  # resolve the split packages from the local oka checkout. Remove these
  # overrides once oka_core/oka_android are published.
  oka_android:
    path: ../../oka/packages/oka_android
  oka_core:
    path: ../../oka/packages/oka_core
  oka_huawei:
    path: ../../oka/packages/oka_huawei
  oka_play:
    path: ../../oka/packages/oka_play
  ecsly:
    path: ../../ecsly/core_packages/ecsly
  # The world inspector's 3D band (ecsly_flutter_scene → flutter_scene):
  # resolve the dev-train scene stack from the same local checkouts the
  # harness repo pins (Last Answer adds Flutter GPU — rev. 3 law: ONE
  # inspector version, the 3D one). Drop when these publish.
  ecsly_flutter:
    path: ../../ecsly/core_packages/ecsly_flutter
  ecsly_flutter_scene:
    path: ../../ecsly/plugins/ecsly_flutter_scene
  dart_acp_toolkit:
    path: ../../../mcp/cline/intentcall/packages/acp_toolkit
  xsoulspace_inference_core:
    path: ../dart_flutter_packages/pkgs/xsoulspace_inference_core
  # afm declares these as `any` (hosted). The app path-depends on the
  # monorepo checkouts; the override is what makes those one package.
  xsoulspace_inference_apple_foundation:
    path: ../dart_flutter_packages/pkgs/xsoulspace_inference_apple_foundation
  xsoulspace_inference_openrouter:
    path: ../dart_flutter_packages/pkgs/xsoulspace_inference_openrouter
  # The Laya decision-model composition (afm's D0/D1 lane, 2026-10-07):
  # local dev train, not yet published — same hosted-`any` rule.
  xsoulspace_inference_laya:
    path: ../dart_flutter_packages/pkgs/xsoulspace_inference_laya
  http: ^1.6.0
  # afm's local small text-model lane (mlx, loopback): committed locally,
  # not yet published — same hosted-`any` rule.
  xsoulspace_inference_mlx:
    path: ../dart_flutter_packages/pkgs/xsoulspace_inference_mlx
  agentic_executables_wire:
    path: ../../agentic_executables/agentic_executables_wire
  ecsly_serialization:
    path: ../../ecsly/plugins/ecsly_serialization
  ecsly_async_parallel:
    path: ../../ecsly/plugins/ecsly_async_parallel
  async_parallel:
    path: ../../ecsly/plugins/async_parallel
  universal_storage_oauth:
    path: ../dart_flutter_packages/pkgs/universal_storage_oauth
  universal_storage_filesystem:
    path: ../dart_flutter_packages/pkgs/universal_storage_filesystem
  universal_storage_git_offline:
    path: ../dart_flutter_packages/pkgs/universal_storage_git_offline
  analyzer: ^14.1.0
  meta: ^1.19.0
  intl: ^0.20.3
  share_plus: ^13.2.1
  xsoulspace_lints:
    path: ../dart_flutter_packages/pkgs/xsoulspace_lints
  dart_style: ^3.1.12
  xsoulspace_ui_foundation:
    path: ../dart_flutter_packages/pkgs/xsoulspace_ui_foundation
  source_gen: ^4.2.3
  xsoulspace_foundation:
    path: ../dart_flutter_packages/pkgs/xsoulspace_foundation
  xsoulspace_locale:
    path: ../dart_flutter_packages/pkgs/xsoulspace_locale
  xsoulspace_state_utils:
    path: ../dart_flutter_packages/pkgs/xsoulspace_state_utils
  # TODO(arenukvern): remove after xsoulspace_monetization_* packages publish
  xsoulspace_installation_store:
    path: ../dart_flutter_packages/pkgs/xsoulspace_installation_store
  xsoulspace_monetization_interface:
    path: ../dart_flutter_packages/pkgs/xsoulspace_monetization_interface
  xsoulspace_monetization_foundation:
    path: ../dart_flutter_packages/pkgs/xsoulspace_monetization_foundation
  xsoulspace_monetization_rustore:
    path: ../dart_flutter_packages/pkgs/xsoulspace_monetization_rustore
  universal_storage_interface:
    path: ../dart_flutter_packages/pkgs/universal_storage_interface
  universal_storage_local_db:
    path: ../dart_flutter_packages/pkgs/universal_storage_local_db
  universal_storage_convergence:
    path: ../dart_flutter_packages/pkgs/universal_storage_convergence
  universal_storage_mesh:
    path: ../dart_flutter_packages/pkgs/universal_storage_mesh
  universal_storage_mesh_transport:
    path: ../dart_flutter_packages/pkgs/universal_storage_mesh_transport
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0

